name: "comfyui_allinone"
version: "4.13.5"
description: "v4.13.5(9:16竖版资产预览+左缘唤回): ①媒体资产面板缩略图改 9:16 竖版预览（单图单列排列）——列表改 grid 单列，缩略图固定 530px 高（全宽298px×16/9），竖图完整显示不再被裁成横条；踩坑：grid 默认 auto 行轨道会把条目压成 ~19px 横条（图片内容贡献被算成 0），必须显式 grid-auto-rows:max-content。②媒体面板开启时左侧导航自动让位，鼠标 x≤170px 唤回导航、离开延时 350ms 收回（document 级 mousemove，替换 v4.13.4 失败的感应区方案并删除其残留——感应区 z-index 曾挡住左缘点击）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.4(面板与导航联动): 媒体资产面板出现时完全贴住左边（left:0），左侧导航自动向左滑出让位；鼠标悬停左缘感应区时导航从左滑回并把面板向右挤出一点位置（!important 保证优先级），移开即还原。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.3(媒体面板移左): 媒体资产面板从右侧移到左侧（与右侧魔导书面板错开，不再抢位置），显示时停在左侧导航右边（避让常驻导航），隐藏时整体滑出屏幕左缘；保持全高贴顶贴底。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.2(固定跳首页第一位): 修复固定标签只排当前页第一位——排序发生在分页之后，固定第 N 页的条目只会跳到该页顶部；现数据加载时把固定名（在前）+收藏名（次之）传给后端 preferred 参数（分页前排序），固定条目天然位于全源第一页首位；固定/取消固定操作后自动跳回首页重新加载。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.1(NSFW开关统一): 修复「开了 NSFW 但 anima 随机图仍过滤色情标签」——界面上唯一可见的 NSFW 开关是 K2 面板的（写 __k2_nsfw__），而 anima 模式读取的是藏在 AstrBot 管理后台的 anima_nsfw（默认 False），用户开的开关管不到正在用的引擎；现 K2 NSFW 开关切换时同步写 anima_nsfw（一个开关管两个引擎），随机抽取判定改为任一开关开启即放行（并集兜底）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.0(固定姿势优先): 修复固定姿势与随机动作冲突——动作姿态二选一组改为永远参与抽取后，固定了某个姿势标签时随机还会再抽一个动作，两个动作并存导致姿势混乱；现检测到固定标签来自 动作姿态/ 源时跳过该组随机抽取，姿势完全以固定为准（NSFW 开关只影响未固定时的二选一）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.6(随机图分类残留): 修复 /随机图 命令仍被旧分类名拦截——v4.7.0 分类更名时该命令的 _ensure_command_workflow 参数漏改（仍是已不存在的「画」分类），动漫画图等工作流明明在文生图分类也被拒；现改为「文生图」，选择菜单与提示语同步。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.5(固定绝对优先): 魔导书数据排序改为固定标签绝对第一——旧排序权重收藏2>固定1，未收藏的固定标签会被收藏标签压在后面；现固定权重×10，固定组内再按收藏排，未收藏的固定标签也稳居最前。两处渲染（画廊卡片/表格）同步修改。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.4(动作姿态NSFW修复): 修复 NSFW 开启后色情动作标签仍抽不到——动作姿态组（正常动作/色情动作二选一）此前要求源已在随机池内才生效，池里没勾动作姿态时该组直接跳过，NSFW 开关等于白开；现该组为核心流程不受池成员限制：池内没勾时自动用配置源参与抽取，NSFW 开关决定取色情动作还是正常动作；另分级标签随 NSFW 切换（开=nsfw，关=safe，此前硬编码 safe 与色情内容矛盾）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.3(固定标记即时刷新): 修复魔导书固定标签后源列表的 has-pin 框框标记不即时更新——固定/取消固定后只重渲染了数据网格和底部标签栏，左侧源列表要手动刷新才变（PC/手机一致）；现两个操作完成后同步重渲染源列表，框框即时出现/消失。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.2(媒体面板tab修复): 媒体资产面板①「已生成」标签改名「图片」；②切到「视频」tab 不加载数据——分页改造后 _mpData 按 tab 类型从服务端拉取，但 setMpTab 只重渲染未重新取数（渲染的还是上一个 tab 的数据）；现切 tab 强制按新类型重新取数。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.1(PC 面板美化): ①媒体资产侧栏改为顶部与浏览器同高、贴右贴底不封顶（去圆角浮窗断口），缩略图 16:10 横版紧凑化 + hover 浮起；②工作流管理器编辑卡片从 9:16 竖版大图改 16:10 横版（卡片高度大减、一屏数量翻倍），别名/分类控件紧凑化，操作行并入卡片底部。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.0(画廊分页加载): 画廊加载模型重做——旧版每次请求全量递归扫描+全量 JSON 返回+前端一次性渲染全部节点，列表越大越慢越费流量；现服务端扫描结果内存缓存（30s TTL，force=1 立即重扫），type/时间过滤下沉服务端，按 offset/limit 分页返回，前端无限滚动追加渲染（哨兵+懒加载），FAB 徽标用服务端总数；媒体资产侧栏拆分独立数据源（按 tab 类型取数，不再与画廊分页数据互相覆盖）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.11.2(批量删除顺滑): 修复批量删除模式两个打架点——①批量模式下工具栏「删除」仍是单删当前张（带确认框），和批量条的「删除选中」并存极易误删未选中的图，现批量模式自动隐藏单删按钮、退出恢复；②「批量」按钮开启后文字不变，不知道再点是退出，现切换为「✓ 完成」。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.11.1(提交失败透传): 生成提交被 ComfyUI 拒绝时不再只报「提交失败」——校验错误消息与节点错误明细（缺失输入等）原样透出到聊天与日志，定位问题不再两眼一抹黑。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.11.0(画廊查看器重构): 单图查看器整体重排——PC 左图右信息布局（提示词面板默认展开、悬浮毛玻璃不挤压图片、📝 按钮可收起）、左右箭头翻页 + 键盘 ←/→ 导航 + Esc 关闭 + 底部缩略图条快速跳转（当前位置高亮）；手机改横向滑动翻页（scroll-snap 横向）+ 底部操作条（复制提示词/删除）+ 顶部信息条；网格模式点图直接进入单图查看器对应张（移除独立灯箱双系统，openLightbox 仅魔导书等处保留）。修复横向轮播宽度爆炸（min-width:100% 在 width:max-content 轨道内循环解析，首张 slide 被撑到 10 万 px，手机端图片全部无法显示）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.10.1(画廊排查修复): ①文件服务补视频 Content-Type（此前 mp4 全 octet-stream，部分内核播放不出）+ Cache-Control 改长缓存（文件名时间戳化天然不可变，no-cache 曾致每次浏览重复下载费流量）；②gif 归图片类（原按视频渲染 <video> 播不了，动图在画廊直接消失）；③删除改按相对路径精确删除——旧版按纯文件名 rglob 取第一个同名文件，多子目录同名时会删错（现 name 兼容保留但多同名时报错防误删），前端批量/单删的键同步改为 rel path；④删图同步清理 prompt_log 同 path 记录。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.10.0(画廊查提示词): 画廊单图查看器新增提示词查询——PC 端点「📝 提示词」打开右侧栏（全文+生成时间+复制按钮，跟随当前查看的图自动刷新），手机端（<768px）预览下方只显示「📋 复制提示词」按钮（点击拉取并直接进剪贴板，不占画幅），内置浏览器 clipboard API 不可用时 execCommand 兜底。后端新增 GET /api/gallery/prompt（路径 resolve 后必须位于输出目录内防穿越；三级匹配：prompt_log path 精确 → 文件 MD5 对 img_hash（带 (path,mtime) 缓存）→ 无记录；生成完成即记录（视频/LLM 工具路径此前不记录，画廊查视频永远无记录）；prompt_log 同 path 幂等不重复堆积。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.9.6(提示词查询修复): 修复 /提示词 在飞书永远失效——记录被 msg_id 门槛挡住（只有 QQ/OneBot 发送回执有 message_id，飞书恒空→完全不记录），且 WebUI 推送路径零记录；现发送即记录（飞书 message_id 留空，靠 path/MD5/dHash 匹配），WebUI 推送也记入 prompt_log 与会话发送表；/提示词 新增第 4 级兜底「本会话最近发送的图」（10 分钟内按 path/MD5 匹配），飞书回复链不带图 URL 也能查。提示词缓存清理对齐：_expanded_prompt_cache（最终提示词内存缓存）此前从不清理、无限堆积，现随每小时清理循环按 prompt_log_days（默认3天）同步回收，源文件已被输出清理删除的条目一并清——与「图片/视频保留三天自动清理」同一节奏。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.9.5(推送提示词开关修复): 修复「图片附带提示词」关闭后飞书仍带提示词——WebUI 生成推送路径（_send_to_target → 飞书/QQ 发送器）无条件把 prompt 拼进「✨ 生成完成」文本，从不检查 show_prompt_on_image 开关（聊天路径 _send_image_result 一直有闸门，只有 WebUI 主动推送这条路漏了）；现统一入口按开关拦截，关闭时推送文本不带提示词。提示词全链路：产生(用户输入→LLM规则改写→pins合并→LoRA触发词→节点注入) → 捕获(扩写节点/回退→_expanded_prompt_cache+prompt_log) → 输出(聊天/WebUI推送/视频三口，视频本就不带)。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.9.4(组绑定防自毁): 修复组控制「经常缺少绑定」——前端 saveParams 无条件上报 __groups_data__（面板无数据时是空数组），后端把空数组解释成「解除绑定」直接删分桶，形成自毁循环：面板一旦因任何原因空一次（指纹重置/切换竞态），用户任意保存参数就会把组绑定静默端掉，面板从此永远空。现后端空 groups_data 只忽略本次上报、绝不删桶（显式解绑走 /api/groups/auto-apply 的 groups:[]），前端空值不再上报双保险。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.9.3(随机池自愈): 修复随机池徽章计数虚高——配置里混入 43 条垃圾源路径（t/1..t/43，来源不明的历史脏数据），界面渲染不出但计数全算、随机抽取撞空；现 rand-pool GET 自愈剔除不存在的源并落盘、POST add 校验源路径必须命中真实词库源白名单（与 sources 扫描同口径，含 Anima 补充源），垃圾路径从此进不了池子。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.9.0(多阶段分辨率保护+组禁用直通重连（含v4.9.1）): 修复 H3 类「一采+二采」工作流二采放大失效——提交链与 /比例 同步会把所有官方 ResolutionSelector 盖成同一个 MP，二采的目标尺寸选择器（如 115 的 1.0MP）被压成一采的 0.5MP，放大链输出的仍是一采分辨率（960×544），「输出是一采」的真正根因（与组控制无关，组禁用一采输出本就正常工作）；现检测文件内各选择器 MP 值不同的多阶段工作流，按原 MP 比例分配目标总像素、只统一宽高比、绝不抹平阶段差；_read_workflow_file_resolution 改取 MP 最大的选择器（最终成品档）为基准。 修复禁用组后下游报 'str' object has no attribute 'model'——组级联删除把幸存节点的已删引用直接填空串，动漫画图禁用「加速」组时组内的 LoraLoaderModelOnly(158) 被删、组外 rgthree Power Lora Loader(159) 的 model 变成字符串即崩（v4.4.10 前组禁用是空操作所以从未暴露，实为老雷）；现按 ComfyUI bypass 语义直通重连——下游改接到被删节点自己的上游（输出序号→输入序号启发式），接力直通直到稳定，找不到上游才退化空串；本地单测验证 159.model 正确跳到基础加载器。动漫画图双 SaveImage 前缀撞车同修（164→Anima_P1，已备份）。 v4.8.0(视频多输出选高清+飞书视频压缩（含v4.8.1）): 修复双 VHS_VideoCombine 工作流交付一采低清版——一采+二采两段合并节点同前缀且都 save_output 时，历史记录两段视频都在，outputs 字典顺序决定交付谁，曾把 0.5MP 一采当成品发给用户（二采 1.0MP 白跑）；现视频任务多输出按文件体积降序排（同等时长下体积与分辨率正相关），高清二采版优先交付，图片批量输出不受影响；同时用户工作流 H3参考生视频.json 的一采 VideoCombine（节点164）前缀改为 Video/H3_Video_P1（已备份 .bak_prefix_20261003），解除 ComfyUI 侧同名计数混叠。 飞书视频 ~10MB 限制适配——二采 1.0MP 视频常超限被飞书拒收；新增 _shrink_video_for_feishu（ffmpeg libx264 重编码，ffprobe 取时长算目标码率，0.92 余量，0.65/0.4 两级降码率重试，+faststart），超限才压、原片保留画廊，压缩与发送分离（asyncio.to_thread 不堵事件循环）；挂接三个视频发送点：/生成视频 命令、comfyui_video 工具、_send_image_to_feishu（QQ 路径不压缩）。 v4.7.2(最近图片本地落地): 修复「图只能在当场那条消息用」——最近图片缓存此前只存平台图片 URL（飞书 URL 短时效），用户隔一条消息再说「重跑/再来一遍」时 URL 已失效，下载失败报「未能获取图片」；现收到图片的瞬间即后台下载落地到 upload_dir/recent_cache/ 本地副本并替换缓存为本地路径（在 _download_image 允许目录内），TTL 10 分钟→1 小时，过期与每小时清理循环自动回收文件；下载全失败时保留原 URL 缓存兜底。 v4.7.0(分类与命令更名+拖动排序修复（含v4.7.1）): ①分类更名——「画」→「文生图」、「图生视频」→「视频」，涉及 LLM 工具分类清单/描述、/工作流 与 /切换 导航、数字菜单、工作流排序、随机图分类校验（兼容旧画分类）、工作流管理页筛选标签、魔导书规则页 t2i 规则判定；②命令更名——/画 → /文生图、/图生视频 → /生成视频，旧命令名保留为等价别名（转发处理器）不破坏肌肉记忆，帮助文本与提示语同步；③数据迁移：分类表与工作流目录按「分类=目录」设计随 API 迁移。 修复侧栏分类拖动排序无效——分类更名后 __category_order__ 里存的是旧名（画/图生视频），_reorderCategories 用旧名单过滤 DOM 分类导致新分类全部被滤掉、indexOf 得 -1 直接 return（拖了白拖且无任何报错）；现以侧栏实际渲染的分类为准构建顺序（未分类保序补末尾），历史陈旧分类名不再参与；配置中的旧名排序已重置为新分类名。 v4.6.0(移除反推+反推分类清理（含v4.6.1）): 删除反推功能整体——主流 LLM 均已自带视觉能力，独立反推（VLM 提取提示词）失去意义；移除 /反推 命令、飞书宽松变体、comfyui_reverse_prompt LLM 工具、_run_reverse_prompt 及工具描述中的反推指引，工作流管理页移除反推分类筛选标签。反推分类降级为普通分类：已有反推目录下的工作流文件保留，仍可正常切换/执行。imgrev 规则（「图片反推·多图结构化」）与反推功能无关，是图生图/图生视频的结构化改写规则，保留不动。 分类体系移除「反推」——LLM 工具分类清单、/工作流 与 /切换 的分类导航/菜单、数字菜单分类消费、_order_workflows_by_category 排序全部去掉反推；已有反推类工作流（图像反推.json）经分类接口归为未分类（文件移回根目录），前端筛选标签已于 v4.6.0 移除。 v4.5.9(编辑类任务防标签污染): 图生图/图生视频不再合并魔导书固定标签——提交链的 pin 合并此前对所有工作流生效，画师/画风固定标签（如 @ebora）被混入编辑指令/视频描述，污染编辑意图（图生视频 prompt 带上画师标签毫无意义）；现带 image_path 的编辑类任务与随机图一样跳过 pin 合并，文生图路径不受影响。K2 组合词本就只作用于随机图路径，无需改动。 v4.5.8(官方面板落盘): 修复官方分辨率面板保存链断裂——面板重建后控件走 saveParams 通道（param_{nid}_* + onchange），而旧版 /api/set-official-res 读取的元素 id 已不存在成死代码，面板改动只进 saved_texts 从未写入工作流文件；叠加 v4.5.7 提交链以文件值为基准，面板设的值（如 4:3）每次被文件旧值（9:16）盖回，表现为「分辨率选择改变不了」。现 /api/workflow-params 拦截分辨率类键（aspect_ratio/megapixels/multiple/width/height）直接原子写入工作流文件（按原输入类型转换、只更新已有输入、不新建），并清除 saved_texts 中该节点的旧分辨率残留；指纹只含节点 ID+类型，写文件不触发重置。 v4.5.7(面板分辨率+进度事件双修+进度实时化（含v4.5.6）): ①修复 WebUI 官方分辨率面板设置被踩——提交链此前用全局默认比例/质量覆盖分辨率节点，官方面板写入工作流文件的值（如 4:3/1.3MP）每次生成都被打回全局默认；现未显式指定时以工作流自带分辨率值为基准（新增 _read_workflow_file_resolution 读 ResolutionSelector 的 aspect_ratio+megapixels 或 AspectRatioNode 的 width/height，这些值由面板与 /比例、/分辨率 命令落盘），当次显式传参（LLM 工具的 ratio/quality）仍优先。②修复 WS 进度事件永远收不到——ComfyUI v0.37 的 /ws 会话参数是驼峰 clientId 且执行事件点对点发给提交者 sid 不广播，插件此前用蛇形 client_id 未被识别成会话、监听连接拿到随机 sid，executing/progress/execution_cached 全部收不到（进度 0% 与节点 0/N 不动的根因）；改用 clientId 后事件直达。 WebUI 进度条从「当前节点采样步」改为合成总进度——旧版取采样节点的 value/max 当百分比，模型加载与非采样节点期间没有任何事件，进度条长时间钉在 0%（用户截图 1分34秒仍 0%），且逐节点间跳变不单调；现 /api/progress 返回 percent=(已完成节点数+当前节点采样分数)/总节点数（封顶 99%，完成翻 idle），并附 node_label（节点 ID 经提交时缓存的 node_map 翻译成 class_type）+节点计数 nodes_done/total；前端显示「当前节点类名 · 节点 n/N · 采样 x/y · 已运行 · 队列」，无事件阶段也有实时节点反馈。 v4.5.5(比例生效修复): 修复官方 ResolutionSelector 工作流比例/质量设置不生效——提交链 _set_resolution 只认手动指定的 __resolution_node__，未指定直接放弃，而这类工作流分辨率存在 aspect_ratio+megapixels 输入里（无 width/height 可读），导致 /比例 与 LLM 传的比例参数永远不改图，ComfyUI 实际按工作流文件里的旧值（如 9:16）出图；现未手动指定时自动探测全部官方 ResolutionSelector/XB 参数节点/AspectRatioNode 兜底写入（与 /比例 同步命令 _sync_resolution_to_workflow 同语义）。 v4.5.4(稳定性): ①魔导书词库写入改原子写(tmp+replace)——此前是裸 open(w) 覆盖写，崩溃/断电可损坏 JSON，叠加读取端异常静默返回空列表，下一次保存就会把整个词库源无声清空；现读取端遇损坏先把坏文件隔离为 .corrupt 保留现场再返回空，写入端与 config.json 同标准原子落盘。②移除生成链路中 v4.4.1 遗留的旧版内联组禁用代码块——v4.4.10 起 _apply_group_modes 已用级联删除完成全部组禁用（含根级兼容合并），遗留块用根级数据二次删除且把下游引用直接置空串（断头不重连），与分桶数据不一致时会留下 ComfyUI 校验错误的图。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.4.0(心主题): WebUI 全面换装「心」主题——单一主题+昼夜双模式（移除原 7 套配色系统与设置页配色下拉）：夜=墨黑+朱红+鎏金、昼=象牙白+红金，CSS 变量全量重调（滚动条/选区/呼吸灯边框/粒子背景同步）；新增 AI 生成昼夜 HD 背景横幅（21:9 2MP 生成经 SeedVR2 7B 三倍放大至 6624×2880 后压缩 2560 宽 webp，经 --custom-bg 钩子注入，用户自定义背景优先级不变）；新增媒体资产侧边栏（ComfyUI 式：生成完成自动弹出，缩略图列表+搜索+灯箱预览，PC 独占 ≥900px，手机走画廊）；节点卡片角色图标套装（8 枚红金透明纹章替换 emoji：正面/负面/图片/尺寸/文本/禁用/Lora/通用，图例条色点保留）；导航纹章 5 枚（工作流/画廊/魔导书/工作流管理/设置）+ 头部 logo 角色徽章（编辑工作流+角色一致性 LoRA 生成）；魔导书 PC 悬浮面板默认宽 72vw→44vw、拖动位置持久化（双击标题栏复位）；昼夜切换合并为单互斥按钮；主题静态资产白名单改 icon- 前缀规则（新增图标免改后端免重启）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。新增 Lora 触发词管理、预览图选择、莫奈色 UI。支持引用图片查询提示词、扩写后文本读取、图片附带提示词开关。v4.3.4(GitHub镜像): 默认同步源切换 GitHub 公开镜像 lxmsqm/astrbot-comfyui-data（匿名 raw，零令牌）——Gitee 公开路线被帐号级限制封死（原仓库打 RAW 滥用标记、新仓库转公开要求绑手机+复审）；gitee 令牌模式保留供私有备份同步；GitHub raw 国内直连不稳时同步会自动重试。 v4.3.6(同步零配置): 云端同步面板移除自定义仓库/令牌输入——数据源固定为官方 GitHub 公开镜像（自定义源无法保证 manifest 与目录结构匹配，属伪需求）；面板只剩缓存勾选与同步按钮，真正开箱即用；后端不再接受前端传入 repo/token。 v4.3.7(同步进度条): 云端同步改为后台任务+进度轮询——点击立即返回，前端每秒拉取 /api/gitee-sync/progress 显示进度条（文件数+字节加权百分比）、实时网速、当前下载文件名与大小；同步在后台线程执行不再受浏览器超时影响，完成/失败自动收尾。 v4.3.8(全新图标): WebUI 图标升级为 AI 生成的「魔导水晶球」设计（紫色水晶球内嵌橙色图片符号+底部摊开的魔法书，贴合插件魔导书与生图主题）——新增多尺寸 favicon ico/PNG（16/32/48/180/192/512）与 apple-touch-icon，小尺寸清晰可辨。 v4.4.0(预览图修复): 修复工作流预览图大图保存失败——前端压缩函数 hasAlpha 判断恒真（|| true 笔误）导致所有图都转 PNG，2048px PNG 可达 4-10MB、base64 后超服务端 client_max_size(20MB) 而被拒（报「无效的 JSON 请求」只提示保存失败）；现真检测透明通道（无透明一律 JPEG，体积小 3-8 倍），client_max_size 提到 64MB，前端上传超时放宽到 120s 并透出后端具体错误。 v4.4.1(组绑定串台修复): 修复组控制串台——_switch_to_workflow 把「组绑定目标」(__bind_target__) 当当前工作流持久化键反复改写，任何工作流切换都会覆盖它，叠加组源丢失后的孤儿状态，导致别的工作流提取的组（如「加速/标准」）显示并错误应用到当前工作流。现拆分专用键 __current_workflow__（记忆当前工作流）与 __bind_target__（仅组绑定），前端/后端对孤儿绑定（source 空）一律作废并自动清理，组禁用只对组源或显式绑定目标生效；旧数据自动迁移。 v4.3.3(公开镜像仓库): 默认同步仓库切换到公开镜像 heigulin/astrbot-comfyui-data-pub——原仓库被 Gitee 打「涉嫌外链滥用(RAW)」标记禁止转公开，保留作私有备份；用户绑定手机后将 pub 仓库设为开源即可全员匿名同步（旧 repo 配置自动迁移到新默认）。 v4.3.2(同步免令牌): 云端同步支持公开仓库匿名拉取——无令牌时走 raw 直链（不占 API 限额，清单读 manifest.json）；令牌模式保留（私有仓库走 contents/blobs）；匿名访问私有仓库时返回明确指引（设为开源或填令牌）。 v4.3.1(同步修复): ①WebUI 同步按钮修复——apiFetch 支持 timeoutMs 覆盖（旧版写死 30s，全量同步 63s 被浏览器掐断报「未知错误」而后端实际成功），同步超时放宽到 12 分钟；②大文件下载修复——Gitee contents 接口对大文件静默截断到 10MB（28MB 角色缓存只回 10MB），改走 git/blobs 接口取完整内容，大小校验失败绝不落盘；③损坏缓存自隔离——JSON 解析失败的缓存改名 .corrupt，避免每次启动解析失败回退 API 重拉；④同步接口加防重入锁。 v4.3.0(数据分离+云端同步): ①插件数据分离——大文件(角色/画师缓存33MB、anima_tools JS回退源7.8MB、用户配置)自动外移到 AstrBot/data/comfyui_allinone_data/，插件目录瘦身满足商店<18MB限制，首次启动自动迁移、失败自动回退插件内旧路径；②新增 data_paths.py 统一目录解析(data_dir_resolver/user_data_dir_resolver/anima_tools_dir_resolver)；③WebUI 设置页新增「云端数据库(Gitee 私有仓库)」分组——填私人令牌一键拉取 words/ 39个词库+K2 与 anima_cache/ 大缓存，同步后自动重载词库无需重启；④新增 gitee_sync.py(断点重试/大小校验/原子写入/状态记录) 与 /api/gitee-sync/* 接口。 v4.2.0(Anima 词库升级): ①画师/角色数据源改为 animadex API（源站已从静态 JS 迁移到 API 架构）——画师标签规范为 @名字（避免括号与权重语法冲突）、角色含规范触发词+外观标签数组+配套 Lora 推荐，图片改用 blobs.animadex.net 真实地址（旧 anima.mooshieblob.com 已失效返回 HTML 导致卡片空白）；②并发分页拉取（8 线程分批，全量画师 9072 条 + 角色 35372 条约 10 分钟，源 API 每页固定 36 条）；③本地缓存三级容错（读缓存→拉 API→回退 JS），缓存位于 data/user/；④**全量汉化**——角色名与 IP/系列名 100% 中文（新增 name_cn / category_cn 字段，前端优先显示中文，支持中文搜索），画师人名为保留原文；⑤新增词库官方规范（38条：质量/评分/年代/安全/主体数）+ 扩充 7 个薄弱分类（肤质/年龄段/内衣泳装/连衣裙/金属/皮革/画风技法），词库 780→935 条；⑥Anima 随机规范增强——固定开头 masterpiece/best quality/score_7/safe、自动补主体数、末尾追加 2 句自然语言（tag+自然语言混合写法）；⑦新增配置 anima_artist_limit / anima_character_limit（默认 0=全量）与 anima_spec_enhance。v4.1.0(飞书适配): ①LLM 工作流分类感知——comfyui_list_workflows 按分类（画/图生图/图生视频/反推）分组输出并为每类标注用途与对应工具，comfyui_get_current_workflow 带分类信息，draw/img2img/video 三个工具描述明确「只能用本分类工作流」，修复 AI 拿图生图工作流做文生图的混淆；②飞书宽松命令匹配——新增 @filter.regex 兜底，容忍「[图片] 图生图」这类占位前缀（仅飞书生效，QQ 原命令逻辑不变），解决含图片的裸命令落到 LLM 导致 AI 乱加戏/念服务器路径的问题；③飞书最近图片缓存——新增消息监听器缓存用户发来的图片（10 分钟），命令在当前消息无图时回退取用，使飞书支持「先发图→再发命令」（不再依赖引用）；④飞书图片超限自动压缩——超 9MB 才压缩（JPEG 质量 95 起降 + 缩尺寸），未超限保持原图，解决 234006 file size exceed；⑤飞书文字/图片分两条发送（适配器混合链会吞文字）；⑥禁止 LLM 在回复中输出服务器文件路径（工具返回值去路径 + 提示词约束）。v4.0.2: 魔导书 K2 面板新增「🎲 生成随机」按钮——调用 K2 引擎随机组一句中文提示词并直接复制到剪贴板（遵守当前字段锁定/NSFW/预设；不生成图片、不回填输入框）；仅 K2 模式可见（anima 模式不显示）。v4.0.1: 多平台发送（原「生成发送 QQ」升级为「平台下拉+ID输入+群聊勾选」，支持 QQ/飞书，命令回复可选自动/固定QQ/固定飞书/两边都发，QQ 逻辑完整保留）；修复图生图核心 bug——工作流节点键 int/str 类型不匹配导致图片从未注入节点（现做类型归一化，并自动识别 LoadImage 节点兜底）；多图工作流只传1张时，未使用的图片节点强制清空引用并删除（防残留旧图污染结果）；注入前无条件清空所有图片节点引用；修复前端「指定节点」取消不掉（取消时显式发送空值覆盖后端）；修复参数下拉改动后关闭卡片重开显示旧值（实时回写内存缓存）。v4.0.0(大版本): 工作流结构化分类（WebUI 设分类自动移动 .json 到 工作流目录/<分类>/ 子文件夹并自动归位已有分类，双区扫描）；K2 字段锁定整合进魔导书（随机/固定/不选三态+必选分类保护）；K2 批量操作（全选随机⇄全部排除、展开合并、整套锁定+NSFW 预设）；K2 字段锁定/NSFW 前后端同步（QQ /随机图 遵守）与随机多张独立组词修复；旧分辨率新增 960P 档与 21:9 比例（WebUI+QQ 命令）。v3.9.0: 新增 K2 人像提示词生成器独立面板（/k2gen 独立页：10 大分区字段、字段级锁定、NSFW 总开关、中文成句输出、超长自动精简），后端 K2 词库接口 K2GenMixin，QQ /随机图 联动 K2 中文成句引擎。v3.8.2: 分辨率设置无效修复（AspectRatioNode 写入嵌套 bug）、魔导书大分类排序生效、魔导书标签交互+初始加载、刷新回生成台、#360 保存名称占位符修复、画师图片换源 anima.mooshieblob.com、WebUI 随机多张发满 10 张、OneBot 直连发送、Clear-Site-Data 缓存根治。v3.8.1: 仅支持 API 格式工作流（删除 UI→API 展开逻辑）、魔导书 toggle 再按关闭、时长 min=1、toast 去重。v3.7.2: 上传图片自动写回 LoadImage 节点并上传 ComfyUI（修复 Invalid image file）、图生视频/图生图空提示词生成、负面提示词紫色化 + 禁用按钮 ⛔ 图标、手机端生成控件布局优化、上传/Lora 文件夹赛博魔法风美化、巡查修复（ensure_future 安全调度/裸 except）。"
