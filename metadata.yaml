name: "comfyui_allinone"
version: "4.1.0"
description: "AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。新增 Lora 触发词管理、预览图选择、莫奈色 UI。支持引用图片查询提示词、扩写后文本读取、图片附带提示词开关。v4.1.0(飞书适配): ①LLM 工作流分类感知——comfyui_list_workflows 按分类（画/图生图/图生视频/反推）分组输出并为每类标注用途与对应工具，comfyui_get_current_workflow 带分类信息，draw/img2img/video 三个工具描述明确「只能用本分类工作流」，修复 AI 拿图生图工作流做文生图的混淆；②飞书宽松命令匹配——新增 @filter.regex 兜底，容忍「[图片] 图生图」这类占位前缀（仅飞书生效，QQ 原命令逻辑不变），解决含图片的裸命令落到 LLM 导致 AI 乱加戏/念服务器路径的问题；③飞书最近图片缓存——新增消息监听器缓存用户发来的图片（10 分钟），命令在当前消息无图时回退取用，使飞书支持「先发图→再发命令」（不再依赖引用）；④飞书图片超限自动压缩——超 9MB 才压缩（JPEG 质量 95 起降 + 缩尺寸），未超限保持原图，解决 234006 file size exceed；⑤飞书文字/图片分两条发送（适配器混合链会吞文字）；⑥禁止 LLM 在回复中输出服务器文件路径（工具返回值去路径 + 提示词约束）。v4.0.2: 魔导书 K2 面板新增「🎲 生成随机」按钮——调用 K2 引擎随机组一句中文提示词并直接复制到剪贴板（遵守当前字段锁定/NSFW/预设；不生成图片、不回填输入框）；仅 K2 模式可见（anima 模式不显示）。v4.0.1: 多平台发送（原「生成发送 QQ」升级为「平台下拉+ID输入+群聊勾选」，支持 QQ/飞书，命令回复可选自动/固定QQ/固定飞书/两边都发，QQ 逻辑完整保留）；修复图生图核心 bug——工作流节点键 int/str 类型不匹配导致图片从未注入节点（现做类型归一化，并自动识别 LoadImage 节点兜底）；多图工作流只传1张时，未使用的图片节点强制清空引用并删除（防残留旧图污染结果）；注入前无条件清空所有图片节点引用；修复前端「指定节点」取消不掉（取消时显式发送空值覆盖后端）；修复参数下拉改动后关闭卡片重开显示旧值（实时回写内存缓存）。v4.0.0(大版本): 工作流结构化分类（WebUI 设分类自动移动 .json 到 工作流目录/<分类>/ 子文件夹并自动归位已有分类，双区扫描）；K2 字段锁定整合进魔导书（随机/固定/不选三态+必选分类保护）；K2 批量操作（全选随机⇄全部排除、展开合并、整套锁定+NSFW 预设）；K2 字段锁定/NSFW 前后端同步（QQ /随机图 遵守）与随机多张独立组词修复；旧分辨率新增 960P 档与 21:9 比例（WebUI+QQ 命令）。v3.9.0: 新增 K2 人像提示词生成器独立面板（/k2gen 独立页：10 大分区字段、字段级锁定、NSFW 总开关、中文成句输出、超长自动精简），后端 K2 词库接口 K2GenMixin，QQ /随机图 联动 K2 中文成句引擎。v3.8.2: 分辨率设置无效修复（AspectRatioNode 写入嵌套 bug）、魔导书大分类排序生效、魔导书标签交互+初始加载、刷新回生成台、#360 保存名称占位符修复、画师图片换源 anima.mooshieblob.com、WebUI 随机多张发满 10 张、OneBot 直连发送、Clear-Site-Data 缓存根治。v3.8.1: 仅支持 API 格式工作流（删除 UI→API 展开逻辑）、魔导书 toggle 再按关闭、时长 min=1、toast 去重。v3.7.2: 上传图片自动写回 LoadImage 节点并上传 ComfyUI（修复 Invalid image file）、图生视频/图生图空提示词生成、负面提示词紫色化 + 禁用按钮 ⛔ 图标、手机端生成控件布局优化、上传/Lora 文件夹赛博魔法风美化、巡查修复（ensure_future 安全调度/裸 except）。"
author: "lxmsqm,黑谷"
license: "MIT"
repository: "https://github.com/lxmsqm/astrbot-omnipotent-comfyui"
dependencies:
  - requests
  - aiohttp
