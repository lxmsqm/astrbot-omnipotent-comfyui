name: "comfyui_allinone"
version: "4.0.1"
description: "AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。新增 Lora 触发词管理、预览图选择、莫奈色 UI。支持引用图片查询提示词、扩写后文本读取、图片附带提示词开关。v4.0.1: 新增「结果发送平台」下拉选择（自动/固定QQ/固定飞书/两边都发）——多平台并存，QQ 逻辑完整保留，飞书走 AstrBot 标准消息链（适配器自动上传素材），切换平台只需改配置。v4.0.0(大版本): 工作流结构化分类（WebUI 设分类自动移动 .json 到 工作流目录/<分类>/ 子文件夹并自动归位已有分类，双区扫描）；K2 字段锁定整合进魔导书（随机/固定/不选三态+必选分类保护）；K2 批量操作（全选随机⇄全部排除、展开合并、整套锁定+NSFW 预设）；K2 字段锁定/NSFW 前后端同步（QQ /随机图 遵守）与随机多张独立组词修复；旧分辨率新增 960P 档与 21:9 比例（WebUI+QQ 命令）。v3.9.0: 新增 K2 人像提示词生成器独立面板（/k2gen 独立页：10 大分区字段、字段级锁定、NSFW 总开关、中文成句输出、超长自动精简），后端 K2 词库接口 K2GenMixin，QQ /随机图 联动 K2 中文成句引擎。v3.8.2: 分辨率设置无效修复（AspectRatioNode 写入嵌套 bug）、魔导书大分类排序生效、魔导书标签交互+初始加载、刷新回生成台、#360 保存名称占位符修复、画师图片换源 anima.mooshieblob.com、WebUI 随机多张发满 10 张、OneBot 直连发送、Clear-Site-Data 缓存根治。v3.8.1: 仅支持 API 格式工作流（删除 UI→API 展开逻辑）、魔导书 toggle 再按关闭、时长 min=1、toast 去重。v3.7.2: 上传图片自动写回 LoadImage 节点并上传 ComfyUI（修复 Invalid image file）、图生视频/图生图空提示词生成、负面提示词紫色化 + 禁用按钮 ⛔ 图标、手机端生成控件布局优化、上传/Lora 文件夹赛博魔法风美化、巡查修复（ensure_future 安全调度/裸 except）。"
author: "lxmsqm,黑谷"
license: "MIT"
repository: "https://github.com/lxmsqm/astrbot-omnipotent-comfyui"
dependencies:
  - requests
  - aiohttp
