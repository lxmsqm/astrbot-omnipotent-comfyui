name: "comfyui_allinone"
version: "3.6.7"
description: "AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。新增 Lora 触发词管理、预览图选择、莫奈色 UI。支持引用图片查询提示词、扩写后文本读取、图片附带提示词开关。v3.6.7: 部署模式说明补全（Windows=tkinter 弹窗选目录，Linux=文本框直存且必须保持 linux，环境无 tkinter）。"
author: "lxmsqm,黑谷"
license: "MIT"
repository: "https://github.com/lxmsqm/astrbot-omnipotent-comfyui"
dependencies:
  - requests
  - aiohttp
