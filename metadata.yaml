name: "comfyui_allinone"
version: "4.13.5"
description: "v4.13.5(9:16资产预览+ComfyUI风导航): ①媒体资产面板参考 ComfyUI 官方资产面板重做——单图单列大卡片，缩略图 contain 完整显示（黑底 letterbox，不再 cover 裁切），文件名左对齐放大，标签页改胶囊按钮，搜索框圆角化+放大镜图标；缩略图固定 530px 高（全宽≈298×16/9），竖图完整显示不再被裁成横条；踩坑：grid 默认 auto 行轨道会把条目压成 ~19px 横条（图片内容贡献被算成 0），必须显式 grid-auto-rows:max-content。②左侧导航参考 ComfyUI 官方重做——贴左全高常驻竖栏（紧贴顶端、图标在上文字在下、选中浅底描边高亮，body 左让位 78px），不再隐藏/唤回：v4.13.4 感应区方案及其残留、媒体面板开启时的左缘 mousemove 唤回逻辑全部移除，媒体面板固定停靠竖栏右侧 92px。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.4(面板与导航联动): 媒体资产面板出现时完全贴住左边（left:0），左侧导航自动向左滑出让位；鼠标悬停左缘感应区时导航从左滑回并把面板向右挤出一点位置（!important 保证优先级），移开即还原。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.3(媒体面板移左): 媒体资产面板从右侧移到左侧（与右侧魔导书面板错开，不再抢位置），显示时停在左侧导航右边（避让常驻导航），隐藏时整体滑出屏幕左缘；保持全高贴顶贴底。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.2(固定跳首页第一位): 修复固定标签只排当前页第一位——排序发生在分页之后，固定第 N 页的条目只会跳到该页顶部；现数据加载时把固定名（在前）+收藏名（次之）传给后端 preferred 参数（分页前排序），固定条目天然位于全源第一页首位；固定/取消固定操作后自动跳回首页重新加载。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.1(NSFW开关统一): 修复「开了 NSFW 但 anima 随机图仍过滤色情标签」——界面上唯一可见的 NSFW 开关是 K2 面板的（写 __k2_nsfw__），而 anima 模式读取的是藏在 AstrBot 管理后台的 anima_nsfw（默认 False），用户开的开关管不到正在用的引擎；现 K2 NSFW 开关切换时同步写 anima_nsfw（一个开关管两个引擎），随机抽取判定改为任一开关开启即放行（并集兜底）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.0(固定姿势优先): 修复固定姿势与随机动作冲突——动作姿态二选一组改为永远参与抽取后，固定了某个姿势标签时随机还会再抽一个动作，两个动作并存导致姿势混乱；现检测到固定标签来自 动作姿态/ 源时跳过该组随机抽取，姿势完全以固定为准（NSFW 开关只影响未固定时的二选一）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.6(随机图分类残留): 修复 /随机图 命令仍被旧分类名拦截——v4.7.0 分类更名时该命令的 _ensure_command_workflow 参数漏改（仍是已不存在的「画」分类），动漫画图等工作流明明在文生图分类也被拒；现改为「文生图」，选择菜单与提示语同步。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.5(固定绝对优先): 魔导书数据排序改为固定标签绝对第一——旧排序权重收藏2>固定1，未收藏的固定标签会被收藏标签压在后面；现固定权重×10，固定组内再按收藏排，未收藏的固定标签也稳居最前。两处渲染（画廊卡片/表格）同步修改。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.4(动作姿态NSFW修复): 修复 NSFW 开启后色情动作标签仍抽不到——动作姿态组（正常动作/色情动作二选一）此前要求源已在随机池内才生效，池里没勾动作姿态时该组直接跳过，NSFW 开关等于白开；现该组为核心流程不受池成员限制：池内没勾时自动用配置源参与抽取，NSFW 开关决定取色情动作还是正常动作；另分级标签随 NSFW 切换（开=nsfw，关=safe，此前硬编码 safe 与色情内容矛盾）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.3(固定标记即时刷新): 修复魔导书固定标签后源列表的 has-pin 框框标记不即时更新——固定/取消固定后只重渲染了数据网格和底部标签栏，左侧源列表要手动刷新才变（PC/手机一致）；现两个操作完成后同步重渲染源列表，框框即时出现/消失。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。"
