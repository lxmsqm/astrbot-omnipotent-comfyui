name: "comfyui_allinone"
version: "4.13.21"
description: "v4.13.21(视频工具提交即返回): 修复「生成视频时 LLM 罢工」——AstrBot 对每个会话加 per-session 锁（session_lock_manager.acquire_lock），工具调用持锁执行；此前 comfyui_video 在工具内 await 完整生成链（视频等待超时 4h），生成期间该会话的一切消息全被阻塞，表现为璃柚不回话。现工具「提交即返回」：立即回复「视频任务已提交，完成后自动发送」，后台链 _bg_video_submit（经 _spawn_bg_video_submit 登记 _background_tasks，卸载可取消）等生成完成后把视频/失败提示推回会话；notify_umo 保留，插件重载取消时仍由 _watch_and_push_video watcher 兜底不丢结果。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.20(组控制当次开关): comfyui_draw / comfyui_img2img / comfyui_video 新增 enable_groups / disable_groups 当次参数（逗号分隔组名），LLM 可按次开关工作流里的可选组（如 H3 的 二采/1采、动漫画图的 加速/标准）——仅本次提交生效、不落盘、不改持久组配置。底层：_process_and_submit(group_overrides) → _apply_group_modes(overrides)：在持久禁用状态之上叠加（先 disable 后 enable，开优先），组名匹配支持 id/全名/「一采↔1采」中文数字归一/唯一子串，歧义或不匹配只记日志、保持原状。新增 comfyui_list_groups 工具（先查组名与当前启用状态）；视频工具的开场消息与结果消息带出当次规格。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.19(视频当次参数): comfyui_video 新增 duration/ratio/quality 三个当次参数——LLM 可按次指定视频规格（如 15 秒 9:16 竖屏），仅本次生效、不落盘、不改工作流默认配置。实现：工具参数 → _process_and_submit(video_overrides) → 新增 _apply_video_overrides（generate.py）：①时长写官方时长节点（PrimitiveFloat/Float，5-60s 钳制，图内 ComfyMathExpression 自动换算帧并补齐）；②比例写官方 ResolutionSelector 的 aspect_ratio（含 XB 系；AspectRatioNode 系按新比例重算宽高）；③画质按档位缩放各阶段 megapixels、保持多阶段档差（与 v4.9.0 语义一致）。单独传比例不动画质档、单独传画质不动比例；不传即保持工作流现成规格。背景：H3参考生视频.json 一采 ResolutionSelector 0.5MP + 二采 2MP，此前 LLM 三个参数全无通道（面板/命令落盘是唯一路径）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.18(魔导书编辑态修复+收藏固定不跳页): ①编辑态复选框遮挡条目名：.grm-item-card 的 padding:12px 14px!important 压过为复选框预留的 :has(.grm-item-checkbox){padding-left:32px}（无 !important），复选框(8~24px)正好盖住文字起点(15px)；现桌面 32px/手机 28px 两处预留规则均加 !important，全平台不再遮挡。②hover 与「已选」不可区分：两者的背景色均被基线 background:var(--input-bg)!important 覆盖成死代码，只剩同一条红边、只能靠小勾选框分辨；现 hover/active 恢复中性高亮(var(--card-hover))、选中为 primary 15% 混色填充，三态色值实测各不相同。③编辑态点整行即勾选：新增 grmCardClick（点击复选框/编辑/删除/图片自身除外），批量勾选不必再瞄准 16px 小框，卡片在编辑态显示 pointer 光标。④收藏/固定不再拽回首页：v4.13.2/v4.13.14 起收藏、固定后强制 _grimoireCurrentPage=1，翻页浏览中操作会把视图跳回第 1 页，浏览体验被打断；现保留重拉数据（preferred 前置排序不变，收藏/固定在数据上仍置顶），仅去掉页码重置，视图留在当前页。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.17(补记：随机抽词上限丢弃角色/画师/固定标签): ① MAX_TAGS=15 总数上限在超限时只按 CORE_KEYWORDS 挑保留项，导致角色/画师/固定标签被随机丢弃——症状为角色凭空消失、固定姿势未生效。现身份锚点不占上限：source 命中 anima 角色/画师源或 category 为固定的标签永不丢弃，上限只约束随机抽来的普通标签。 ② 补修 source 带 .json 后缀导致白名单永不命中（原判断拿带后缀路径比 /characters 结尾，永远匹配不上）；现先剥 .json 再比较（_is_anima_source 自身已剥，属双保险）。 本条为补记 10-12~13 的两处提交（7676547 / fe36c11）并入版本历史。 v4.13.16(修复Anima随机NSFW开关): ①开关失效主因：Anima 随机用 _nsfw_on = __k2_nsfw__ or anima_nsfw 的**并集**，K2 开关残留 True 时，用户在界面关掉 Anima 开关也关不掉 NSFW（照样出色情内容）。改为**各自独立**：Anima 随机只看 anima_nsfw，K2 组句自己读 __k2_nsfw__；同时 /api/k2-nsfw 不再把 K2 的值写进 anima_nsfw（旧版双向同步会覆盖用户设置），仅在显式传 sync_anima=true 时同步。 ②关键词误杀：_is_nsfw_tag 用裸子串匹配，实测 `cock` 误杀画师 @andrewcockroach 与正常服装 cocktail dress，`sex` 误杀画师 @cutesexyrobutts。现对 **@开头画师标签直接跳过**NSFW 判定，短/歧义词（sex/cock/cum/anal/dick/facial/leash/presenting/restrained/suspension/bondage）改用**词边界**匹配。全库 4180 标签实测：仅 3 个判定改变，全部为误杀修复，无误漏。 ③实测：关→safe 无色情；开→nsfw 含 nude；再关→恢复 safe（旧版关不掉）。 v4.13.15(修复媒体资产面板出图晚一轮): 生成完成后媒体资产面板的新图要等下一轮才出现（晚一轮刷新）。根因：后端 /api/gallery 有 30s TTL 扫描缓存，loadGalleryImages 一直正确传 force=1，但 loadMediaPanel 重新拉取时**漏传 force=1** → 拿到的是生成前的旧快照。修法：loadMediaPanel(force) 在 force 时带 force=1；生成完成的刷新改为两次 force 重扫（800ms / 2.5s），避免慢盘/大图情况下文件尚未落盘。实测：点击随机生成，完成后同一次检测即出现新图（此前需等下一轮约 5s）。 v4.13.14(收藏置顶+只看收藏筛选): ①修复收藏置顶：点收藏后只做前端重渲染，新收藏只能挤到「当前页首排」，到不了整个列表最前面；改为收藏后重新拉数据（带 preferred 让后端在分页前重排）并跳回第 1 页，与其它收藏并排。②新增「只看收藏」筛选按钮（详情区，跨页）——请求带 stars_only（逗号分隔收藏名），后端在该数据源内只保留命中条目（大小写不敏感），按钮有激活态与文字切换。③附带说明：收藏数据里存在 35 组大小写重复（同一角色大小写两种写法被分别收藏），按 lower 去重后 107 条收藏对应 72 个唯一条目，筛选结果数量以此为准。 v4.13.13(修复预设LoRA无法应用到未配置过的工作流): 应用魔导书预设时报「当前工作流没有权重Lora加载器节点，已跳过 LoRA 部分」，但工作流明明有权重Lora加载器节点。根因：应用逻辑判断「有没有 LoRA 节点」用的是 __lora_nodes__ 配置是否为空 —— 配置为空只说明该工作流还没配过 LoRA，恰恰是预设最该发挥作用的场景，却被当成没有节点而跳过。修法：__lora_nodes__ 为空时扫描工作流文件发现 Power Lora Loader 节点（_find_power_lora_nodes，识别口径与前端一致：class_type/title 含 power lora，标准 LoraLoader/LoraLoaderModelOnly 不算）作为写入目标。实测预设 6 个 LoRA 成功恢复。 v4.13.12(修复手机端魔导书布局): 手机端魔导书面板分类树挤成窄竖列、展开全部/全选随机/预设按钮悬浮在中间空白区。根因是两套手机布局规则冲突：旧版左右分栏规则（.grimoire-body row + .grimoire-sources 120px，文件靠后）与 v4.13.x Linear 全屏单列规则（#grimoire_sheet 专属，特异性高但靠前）打架；且横滑规则作用错了层 —— .grimoire-source-list 里现在是 .grm-toolbar + .source-group-list 两块，整体 flex row 会把工具栏和分类树并排。修法：删除旧分栏死规则；.grimoire-source-list 恢复纵向块布局；分类树手机端紧凑排版（组头全宽、子项胶囊横排换行）。PC 双栏布局无回归。 v4.13.11(修复9个LLM工具绑定失效): v4.13.5 模块拆分后，@filter.llm_tool 定义在子模块（core/grimoire、core/llm_tools）里，而框架 star_manager 绑定插件实例时判断 handler.__module__ == metadata.module_path（严格相等，子模块 != 插件根）→ 不绑定 → LLM 调用时 event 被顶到 self 位置，报 missing 1 required positional argument event，comfyui_grimoire_add/_delete/_edit/set_prompt_model/search_tags/list_grimoire/manage_pool/manage_pin/get_prompt 共 9 个工具全废。修法：改类式 FunctionTool（与 comfyui_draw 同范式），走 _register_tools 的 _plugin 通道；方法体保留在 Mixin 上（去装饰器），类里薄委托，逻辑零改动。func_list 23 个工具全部在列。 v4.13.10(LoRA旧路径自动纠正): 在 PC 上搬动 models/loras 子目录后，工作流/配置里存的旧路径会被 ComfyUI 以 value_not_in_list 拒绝（'prompt outputs failed validation'）。现插件以 PC ComfyUI 的实际列表为准，提交前**按文件名自动纠正**失效的 LoRA 路径：权重Lora加载器(_apply_loras)与标准 LoraLoader(_apply_workflow_config)两处都纠正。规则：仅当 PC 上存在**唯一同名文件**时才改写为新路径（宁可不改也不猜错）；同名多个或文件已删除则保持原值并记警告。生成链提交前用 _refresh_lora_list 预热列表（TTL 60s）保证同步的 _apply_loras 有数据。前端 _remapStaleLoraPaths 同步纠正并落盘，界面即时反映；已失效的条目置为停用。另：/api/debug-group-chain 增加 LoRA 阶段快照（只读干跑，便于排查路径问题）。 v4.13.9(魔导书按工作流隔离): 固定标签 / 随机池 / 预设 三者全部改为**按工作流分桶**存储，切工作流互不干扰：顶层映射 __grimoire_pins_by_wf__ / __grimoire_rand_pool_by_wf__ / __grimoire_presets_by_wf__。 首次读取时自动把老版本的全局单例数据迁移进「当前工作流」桶（幂等，老键保留便于回退）。 ⭐ 为什么放顶层映射而不塞进 __workflow_node_configs__：后者在换工作流文件时会被 _compute_fingerprint 判为文件变更而整段清理，会把固定标签/随机池一起清掉。 同步改造生成链：_get_pinned_tags(main.py) 与 random-pick(grimoire.py) 都改读当前工作流的桶，否则会出现「界面有标签但抽词抽不到」；LLM 工具 manage_pin/unpin_tag/rand_pool/预设列表删除共 14 处一并跟随当前工作流。前端 switchWF 后重载固定标签与预设列表。 删除工作流不连坐清理（按陷阱 8）。 v4.13.8(预设LoRA作用域修正): 修正 v4.13.7 引入的语义漏洞——预设是全局的（固定标签/随机池与工作流无关，本就跨工作流通用），但 LoRA 配置是工作流派生的（按 {工作流:{节点ID:[]}} 存、节点 ID 跨工作流不通用），导致在 A 工作流存的预设拿到 B 工作流应用时，会把 A 的 LoRA 名写进 B 的权重Lora加载器。 现给预设的 LoRA 部分记录来源工作流 lora_source_wf：应用时若当前工作流 != 来源则**跳过 LoRA 部分**并提示； 同名工作流才恢复。固定标签/随机池仍保持全局语义不变。 预设菜单的 LoRA 标记同时显示数量与来源工作流名。 按文档陷阱 8，删除工作流**不连坐**删除预设（来源失效时应用端跳过 LoRA 即可，不做破坏性连坐清理）。 v4.13.7(预设含LoRA): 魔导书预设（固定标签+随机池）现在同时保存/恢复**权重Lora加载器**（Power Lora Loader/rgthree）的所选 LoRA。 只纳管权重Lora加载器节点，工作流里固定写死的常规 LoraLoader 一律不动。 存取语义：预设是全局的、而 LoRA 配置按 {工作流:{节点ID:[...]}} 存、节点 ID 跨工作流不通用，所以预设里只存纯 LoRA 列表（按节点分组），应用时写回当前工作流的权重Lora加载器节点。 选取端校验：应用时对照 /api/loras 检查 lora_name 是否仍存在，缺失的条目保留但置 on=false 并 toast 警告（不静默写进生成链）；当前工作流无权重Lora加载器时跳过 LoRA 部分并提示，不硬造节点。 预设菜单在含 LoRA 的条目上标注数量以区分纯标签预设。 v4.13.6(前端布局重构): ①生成台改 PC 两栏——左栏参数（提示词/负面/分辨率/UNet/风格），右栏组控制+上传图片+Lora+节点列表，各栏独立滚动；组控制压成一行（141→54px）；两栏限总宽 1600px 居中，宽屏不再把右栏拉到 1787px。 ②修复右栏 flex 压塌导致内容被裁——#gen_side 子项显式 flex-shrink:0 + 放开 overflow，LoRA 展开从 34px 恢复完整、H3 上传区不再挤成团。 ③桌面两栏判定改用 (pointer:fine)——原来按 navigator.maxTouchPoints/ontouchstart 判触摸，Windows Chrome 在无触摸屏机器上也会把 ontouchstart 报真，会把 PC 误判成手机强制单列；同时修正 .main-content 默认方向依赖 body.page-gen 类的问题（该类只由 switchPage 添加，而手机端 _initInitialPage 直接 return，导致手机根上没有该类、左栏被挤成细柱）。 ④手机端工作流侧栏一行固定 3 张 + 横向滑动，名字不再被词内截断；工作流编辑页加 flex-shrink:0 修分类头被卡片压住，改紧凑网格。 ⑤节点列表加折叠按钮（localStorage 记忆）。 ⑥上传区照 ComfyUI-BlackRin 重做为等宽方格（H3 从 1400px+ 降到 211px），音频整行细条。 ⑦魔导书左侧工具栏统一尺寸（32px 等高对齐）、源列表 140→180px、预设菜单收纳删除按钮。 v4.13.5(9:16资产预览+ComfyUI风导航): ①媒体资产面板参考 ComfyUI 官方资产面板重做——单图单列大卡片，缩略图 contain 完整显示（黑底 letterbox，不再 cover 裁切），文件名左对齐放大，标签页改胶囊按钮，搜索框圆角化+放大镜图标；缩略图固定 530px 高（全宽≈298×16/9），竖图完整显示不再被裁成横条；踩坑：grid 默认 auto 行轨道会把条目压成 ~19px 横条（图片内容贡献被算成 0），必须显式 grid-auto-rows:max-content。②左侧导航参考 ComfyUI 官方重做——贴左全高常驻竖栏（紧贴顶端、图标在上文字在下、选中浅底描边高亮，body 左让位 78px），不再隐藏/唤回：v4.13.4 感应区方案及其残留、媒体面板开启时的左缘 mousemove 唤回逻辑全部移除，媒体面板固定停靠竖栏右侧 92px。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.4(面板与导航联动): 媒体资产面板出现时完全贴住左边（left:0），左侧导航自动向左滑出让位；鼠标悬停左缘感应区时导航从左滑回并把面板向右挤出一点位置（!important 保证优先级），移开即还原。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.3(媒体面板移左): 媒体资产面板从右侧移到左侧（与右侧魔导书面板错开，不再抢位置），显示时停在左侧导航右边（避让常驻导航），隐藏时整体滑出屏幕左缘；保持全高贴顶贴底。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.2(固定跳首页第一位): 修复固定标签只排当前页第一位——排序发生在分页之后，固定第 N 页的条目只会跳到该页顶部；现数据加载时把固定名（在前）+收藏名（次之）传给后端 preferred 参数（分页前排序），固定条目天然位于全源第一页首位；固定/取消固定操作后自动跳回首页重新加载。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.1(NSFW开关统一): 修复「开了 NSFW 但 anima 随机图仍过滤色情标签」——界面上唯一可见的 NSFW 开关是 K2 面板的（写 __k2_nsfw__），而 anima 模式读取的是藏在 AstrBot 管理后台的 anima_nsfw（默认 False），用户开的开关管不到正在用的引擎；现 K2 NSFW 开关切换时同步写 anima_nsfw（一个开关管两个引擎），随机抽取判定改为任一开关开启即放行（并集兜底）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.0(固定姿势优先): 修复固定姿势与随机动作冲突——动作姿态二选一组改为永远参与抽取后，固定了某个姿势标签时随机还会再抽一个动作，两个动作并存导致姿势混乱；现检测到固定标签来自 动作姿态/ 源时跳过该组随机抽取，姿势完全以固定为准（NSFW 开关只影响未固定时的二选一）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.6(随机图分类残留): 修复 /随机图 命令仍被旧分类名拦截——v4.7.0 分类更名时该命令的 _ensure_command_workflow 参数漏改（仍是已不存在的「画」分类），动漫画图等工作流明明在文生图分类也被拒；现改为「文生图」，选择菜单与提示语同步。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.5(固定绝对优先): 魔导书数据排序改为固定标签绝对第一——旧排序权重收藏2>固定1，未收藏的固定标签会被收藏标签压在后面；现固定权重×10，固定组内再按收藏排，未收藏的固定标签也稳居最前。两处渲染（画廊卡片/表格）同步修改。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.4(动作姿态NSFW修复): 修复 NSFW 开启后色情动作标签仍抽不到——动作姿态组（正常动作/色情动作二选一）此前要求源已在随机池内才生效，池里没勾动作姿态时该组直接跳过，NSFW 开关等于白开；现该组为核心流程不受池成员限制：池内没勾时自动用配置源参与抽取，NSFW 开关决定取色情动作还是正常动作；另分级标签随 NSFW 切换（开=nsfw，关=safe，此前硬编码 safe 与色情内容矛盾）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.3(固定标记即时刷新): 修复魔导书固定标签后源列表的 has-pin 框框标记不即时更新——固定/取消固定后只重渲染了数据网格和底部标签栏，左侧源列表要手动刷新才变（PC/手机一致）；现两个操作完成后同步重渲染源列表，框框即时出现/消失。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。"
