name: "comfyui_allinone"
version: "4.13.9"
description: "v4.13.9(魔导书按工作流隔离): 固定标签 / 随机池 / 预设 三者全部改为**按工作流分桶**存储，切工作流互不干扰：顶层映射 __grimoire_pins_by_wf__ / __grimoire_rand_pool_by_wf__ / __grimoire_presets_by_wf__。 首次读取时自动把老版本的全局单例数据迁移进「当前工作流」桶（幂等，老键保留便于回退）。 ⭐ 为什么放顶层映射而不塞进 __workflow_node_configs__：后者在换工作流文件时会被 _compute_fingerprint 判为文件变更而整段清理，会把固定标签/随机池一起清掉。 同步改造生成链：_get_pinned_tags(main.py) 与 random-pick(grimoire.py) 都改读当前工作流的桶，否则会出现「界面有标签但抽词抽不到」；LLM 工具 manage_pin/unpin_tag/rand_pool/预设列表删除共 14 处一并跟随当前工作流。前端 switchWF 后重载固定标签与预设列表。 删除工作流不连坐清理（按陷阱 8）。 v4.13.8(预设LoRA作用域修正): 修正 v4.13.7 引入的语义漏洞——预设是全局的（固定标签/随机池与工作流无关，本就跨工作流通用），但 LoRA 配置是工作流派生的（按 {工作流:{节点ID:[]}} 存、节点 ID 跨工作流不通用），导致在 A 工作流存的预设拿到 B 工作流应用时，会把 A 的 LoRA 名写进 B 的权重Lora加载器。 现给预设的 LoRA 部分记录来源工作流 lora_source_wf：应用时若当前工作流 != 来源则**跳过 LoRA 部分**并提示； 同名工作流才恢复。固定标签/随机池仍保持全局语义不变。 预设菜单的 LoRA 标记同时显示数量与来源工作流名。 按文档陷阱 8，删除工作流**不连坐**删除预设（来源失效时应用端跳过 LoRA 即可，不做破坏性连坐清理）。 v4.13.7(预设含LoRA): 魔导书预设（固定标签+随机池）现在同时保存/恢复**权重Lora加载器**（Power Lora Loader/rgthree）的所选 LoRA。 只纳管权重Lora加载器节点，工作流里固定写死的常规 LoraLoader 一律不动。 存取语义：预设是全局的、而 LoRA 配置按 {工作流:{节点ID:[...]}} 存、节点 ID 跨工作流不通用，所以预设里只存纯 LoRA 列表（按节点分组），应用时写回当前工作流的权重Lora加载器节点。 选取端校验：应用时对照 /api/loras 检查 lora_name 是否仍存在，缺失的条目保留但置 on=false 并 toast 警告（不静默写进生成链）；当前工作流无权重Lora加载器时跳过 LoRA 部分并提示，不硬造节点。 预设菜单在含 LoRA 的条目上标注数量以区分纯标签预设。 v4.13.6(前端布局重构): ①生成台改 PC 两栏——左栏参数（提示词/负面/分辨率/UNet/风格），右栏组控制+上传图片+Lora+节点列表，各栏独立滚动；组控制压成一行（141→54px）；两栏限总宽 1600px 居中，宽屏不再把右栏拉到 1787px。 ②修复右栏 flex 压塌导致内容被裁——#gen_side 子项显式 flex-shrink:0 + 放开 overflow，LoRA 展开从 34px 恢复完整、H3 上传区不再挤成团。 ③桌面两栏判定改用 (pointer:fine)——原来按 navigator.maxTouchPoints/ontouchstart 判触摸，Windows Chrome 在无触摸屏机器上也会把 ontouchstart 报真，会把 PC 误判成手机强制单列；同时修正 .main-content 默认方向依赖 body.page-gen 类的问题（该类只由 switchPage 添加，而手机端 _initInitialPage 直接 return，导致手机根上没有该类、左栏被挤成细柱）。 ④手机端工作流侧栏一行固定 3 张 + 横向滑动，名字不再被词内截断；工作流编辑页加 flex-shrink:0 修分类头被卡片压住，改紧凑网格。 ⑤节点列表加折叠按钮（localStorage 记忆）。 ⑥上传区照 ComfyUI-BlackRin 重做为等宽方格（H3 从 1400px+ 降到 211px），音频整行细条。 ⑦魔导书左侧工具栏统一尺寸（32px 等高对齐）、源列表 140→180px、预设菜单收纳删除按钮。 v4.13.5(9:16资产预览+ComfyUI风导航): ①媒体资产面板参考 ComfyUI 官方资产面板重做——单图单列大卡片，缩略图 contain 完整显示（黑底 letterbox，不再 cover 裁切），文件名左对齐放大，标签页改胶囊按钮，搜索框圆角化+放大镜图标；缩略图固定 530px 高（全宽≈298×16/9），竖图完整显示不再被裁成横条；踩坑：grid 默认 auto 行轨道会把条目压成 ~19px 横条（图片内容贡献被算成 0），必须显式 grid-auto-rows:max-content。②左侧导航参考 ComfyUI 官方重做——贴左全高常驻竖栏（紧贴顶端、图标在上文字在下、选中浅底描边高亮，body 左让位 78px），不再隐藏/唤回：v4.13.4 感应区方案及其残留、媒体面板开启时的左缘 mousemove 唤回逻辑全部移除，媒体面板固定停靠竖栏右侧 92px。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.4(面板与导航联动): 媒体资产面板出现时完全贴住左边（left:0），左侧导航自动向左滑出让位；鼠标悬停左缘感应区时导航从左滑回并把面板向右挤出一点位置（!important 保证优先级），移开即还原。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.3(媒体面板移左): 媒体资产面板从右侧移到左侧（与右侧魔导书面板错开，不再抢位置），显示时停在左侧导航右边（避让常驻导航），隐藏时整体滑出屏幕左缘；保持全高贴顶贴底。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.2(固定跳首页第一位): 修复固定标签只排当前页第一位——排序发生在分页之后，固定第 N 页的条目只会跳到该页顶部；现数据加载时把固定名（在前）+收藏名（次之）传给后端 preferred 参数（分页前排序），固定条目天然位于全源第一页首位；固定/取消固定操作后自动跳回首页重新加载。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.1(NSFW开关统一): 修复「开了 NSFW 但 anima 随机图仍过滤色情标签」——界面上唯一可见的 NSFW 开关是 K2 面板的（写 __k2_nsfw__），而 anima 模式读取的是藏在 AstrBot 管理后台的 anima_nsfw（默认 False），用户开的开关管不到正在用的引擎；现 K2 NSFW 开关切换时同步写 anima_nsfw（一个开关管两个引擎），随机抽取判定改为任一开关开启即放行（并集兜底）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.13.0(固定姿势优先): 修复固定姿势与随机动作冲突——动作姿态二选一组改为永远参与抽取后，固定了某个姿势标签时随机还会再抽一个动作，两个动作并存导致姿势混乱；现检测到固定标签来自 动作姿态/ 源时跳过该组随机抽取，姿势完全以固定为准（NSFW 开关只影响未固定时的二选一）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.6(随机图分类残留): 修复 /随机图 命令仍被旧分类名拦截——v4.7.0 分类更名时该命令的 _ensure_command_workflow 参数漏改（仍是已不存在的「画」分类），动漫画图等工作流明明在文生图分类也被拒；现改为「文生图」，选择菜单与提示语同步。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.5(固定绝对优先): 魔导书数据排序改为固定标签绝对第一——旧排序权重收藏2>固定1，未收藏的固定标签会被收藏标签压在后面；现固定权重×10，固定组内再按收藏排，未收藏的固定标签也稳居最前。两处渲染（画廊卡片/表格）同步修改。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.4(动作姿态NSFW修复): 修复 NSFW 开启后色情动作标签仍抽不到——动作姿态组（正常动作/色情动作二选一）此前要求源已在随机池内才生效，池里没勾动作姿态时该组直接跳过，NSFW 开关等于白开；现该组为核心流程不受池成员限制：池内没勾时自动用配置源参与抽取，NSFW 开关决定取色情动作还是正常动作；另分级标签随 NSFW 切换（开=nsfw，关=safe，此前硬编码 safe 与色情内容矛盾）。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。 v4.12.3(固定标记即时刷新): 修复魔导书固定标签后源列表的 has-pin 框框标记不即时更新——固定/取消固定后只重渲染了数据网格和底部标签栏，左侧源列表要手动刷新才变（PC/手机一致）；现两个操作完成后同步重渲染源列表，框框即时出现/消失。 AstrBot ComfyUI 插件，支持文生图、图生图、视频、编辑，自带 WebUI 面板。"
